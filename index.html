<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tabel Data Google Sheets</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .btn-view {
            color: #007bff;
            cursor: pointer;
            text-decoration: underline;
            border: none;
            background: none;
            padding: 0;
            font-size: inherit;
        }
        .btn-view:hover {
            color: #0056b3;
        }

        /* Styling Modal Gambar */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            padding-top: 50px; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            overflow: auto; 
            background-color: rgba(0,0,0,0.8); 
        }
        .modal-content {
            margin: auto;
            display: block;
            max-width: 80%;
            max-height: 80vh;
            border-radius: 8px;
        }
        .close-modal {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        .close-modal:hover {
            color: #bbb;
        }
    </style>
</head>
<body>

    <div id="loading">Memuat data...</div>
    <table id="tabel-data" style="display:none;">
        <thead>
            <tr id="header-tabel"></tr>
        </thead>
        <tbody id="isi-tabel"></tbody>
    </table>

    <!-- Modal Pop-up Gambar -->
    <div id="imageModal" class="modal">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="imgModalTarget" alt="Pratinjau Gambar">
    </div>

    <script>
        const urlCSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSNBYxoQoiVWQRaeneouLhb9f1FZDdZU9rc_47vPIfWmjkqXxRuBiCwYIyCN5nJvr_FZTqPZCC02eyn/pub?gid=0&single=true&output=csv';

        fetch(urlCSV)
            .then(response => response.text())
            .then(csvText => {
                const rows = csvText.trim().split('\n').map(row => row.split(','));
                
                // 1. Ambil Header & Tambahkan Header Kolom Aksi di Paling Kanan
                const headers = rows[0];
                const headerRow = document.getElementById('header-tabel');
                headers.forEach(h => {
                    const th = document.createElement('th');
                    th.textContent = h.trim();
                    headerRow.appendChild(th);
                });

                // Tambah Header Kolom Aksi
                const thAction = document.createElement('th');
                thAction.textContent = 'Gambar';
                headerRow.appendChild(thAction);

                // 2. Ambil Isi Data
                const tbody = document.getElementById('isi-tabel');
                for (let i = 1; i < rows.length; i++) {
                    const tr = document.createElement('tr');
                    const rowData = rows[i];

                    // Tampilkan data kolom bawaan
                    rowData.forEach(cell => {
                        const td = document.createElement('td');
                        td.textContent = cell.trim();
                        tr.appendChild(td);
                    });

                    // 3. Tentukan URL Gambar
                    // Opsi A: Jika URL gambar ada di salah satu kolom CSV (misal kolom indeks ke-2 / kolom ke-3)
                    // const imageUrl = rowData[2] ? rowData[2].trim() : '';

                    // Opsi B: Contoh gambar dummy (Ganti bagian ini sesuai sumber URL gambar Anda)
                    const imageUrl = 'https://picsum.photos/800/600?random=' + i;

                    // 4. Buat Kolom Aksi di Paling Kanan
                    const tdAction = document.createElement('td');
                    if (imageUrl) {
                        const btn = document.createElement('button');
                        btn.className = 'btn-view';
                        btn.textContent = 'Lihat Gambar';
                        btn.onclick = () => openModal(imageUrl);
                        tdAction.appendChild(btn);
                    } else {
                        tdAction.textContent = '-';
                    }
                    tr.appendChild(tdAction);

                    tbody.appendChild(tr);
                }

                document.getElementById('loading').style.display = 'none';
                document.getElementById('tabel-data').style.display = 'table';
            })
            .catch(err => {
                document.getElementById('loading').innerText = 'Gagal memuat data dari Google Sheets.';
                console.error(err);
            });

        // Fungsi Buka & Tutup Modal
        function openModal(imageSrc) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('imgModalTarget');
            modal.style.display = "block";
            modalImg.src = imageSrc;
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = "none";
        }

        // Tutup modal jika area luar gambar diklik
        window.onclick = function(event) {
            const modal = document.getElementById('imageModal');
            if (event.target === modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
